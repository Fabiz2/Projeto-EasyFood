<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyFood - Restaurantes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🍽️</div>
        <span class="brand-text">EasyFood</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-link active" href="#">
          <span class="nav-icon">☰</span>
          <span>Restaurantes</span>
        </a>
        <a class="nav-link" href="#">
          <span class="nav-icon">✦</span>
          <span>Dashboard</span>
        </a>
      </nav>

      <div class="sidebar-card">
        <span class="sidebar-card-label">Hoje</span>
        <span class="sidebar-card-number" id="restaurant-count">0</span>
        <span class="sidebar-card-text">restaurantes</span>
      </div>
    </aside>

    <main class="main-content">
      <section class="topbar">
        <div>
          <p class="section-label">Gerenciador de restaurantes</p>
          <h1>EasyFood</h1>
        </div>
        <button class="refresh-button" id="refresh-button">
          <span class="refresh-icon">⟳</span>
        </button>
      </section>

      <section class="workspace-grid">
        <section class="panel form-panel">
          <div class="panel-header">
            <span class="panel-kicker">Novo restaurante</span>
            <span class="panel-icon">+</span>
          </div>

          <form id="restaurant-form" class="restaurant-form">
            <div class="input-group">
              <label for="name">Nome</label>
              <input type="text" id="name" name="name" placeholder="Ex: Sabor & Arte" required />
            </div>

            <div class="input-group">
              <label for="category">Categoria</label>
              <input type="text" id="category" name="category" placeholder="Ex: Brasileira" required />
            </div>

            <div class="input-group">
              <label for="rating">Avaliação</label>
              <input type="number" id="rating" name="rating" min="0" max="5" step="0.5" placeholder="4.5" required />
            </div>

            <button type="submit" class="submit-button">
              <span class="button-icon">✚</span>
              <span>Cadastrar restaurante</span>
            </button>
          </form>

          <div id="message" class="message" role="status" aria-live="polite"></div>
        </section>

        <section class="panel list-panel">
          <div class="panel-header list-header">
            <div>
              <span class="panel-kicker">Catálogo</span>
              <h2>Restaurantes</h2>
            </div>
            <div class="loading-wrap" id="loading-wrap">
              <span class="loader"></span>
              <span class="loader-text">Carregando...</span>
            </div>
          </div>

          <div class="restaurant-list" id="restaurant-list">
            <div class="empty-state">
              <span class="empty-icon">🍽️</span>
              <p>Sem restaurantes cadastrados.</p>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
</html>
